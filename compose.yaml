services:
  campfire:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      SERVER_NAME: "My Campfire server"
      PUBLIC_ADDRESS: "${PUBLIC_ADDRESS:-}"
      CAMPFIRE_NEW_IDENTITY: "${CAMPFIRE_NEW_IDENTITY:-}"
      CLIENT_ORIGINS: "${CLIENT_ORIGINS:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      MAX_STORED_UPLOAD_BYTES: "${MAX_STORED_UPLOAD_BYTES:-1073741824}"
      ICE_SERVERS: "${ICE_SERVERS:-[]}"
      KLIPY_API_KEY: "${KLIPY_API_KEY:-}"
      LINK_PREVIEWS: "${LINK_PREVIEWS:-on}"
    volumes:
      - campfire-data:/data
volumes:
  campfire-data:
