name: Project checks
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    check:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - name: Build native audio helper
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libx11-dev pkg-config
                  npm run build:pipewire
            - run: npm run format:check
            - run: npm run check
            - run: npm test
            - run: npm run build
