name: Linux standalone builds
on:
    workflow_dispatch:
        inputs:
            default_server_url:
                description: 'Optional public server URL, e.g. https://chat.example.com'
                required: false
                type: string
permissions:
    contents: read
jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - name: Install native audio build dependencies
              run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libx11-dev pkg-config
            - run: npm run format:check
            - run: npm test
            - name: Build Linux x64 standalone packages
              run: npm run dist:linux
              env:
                  VITE_DEFAULT_SERVER_URL: ${{ inputs.default_server_url }}
            - uses: actions/upload-artifact@v4
              with:
                  name: Campfire-Linux-x64-Standalone
                  path: |
                      release/*.AppImage
                      release/*-linux-x64.tar.gz
                      release/latest-linux.yml
                  if-no-files-found: error
                  retention-days: 1
